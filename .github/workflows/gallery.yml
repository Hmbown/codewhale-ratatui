name: Gallery previews

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gallery-pr-{0}', github.event.pull_request.number) || format('gallery-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  previews:
    name: README matches the components
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Gallery scrolling tests
        run: cargo test --locked --example gallery
      - name: Render every component in every terminal profile
        run: cargo run --locked --example gallery -- --svg target/readme-buffers
      - name: README previews match the actual buffers
        run: python3 tools/render-gallery.py target/readme-buffers assets/readme --readme README.md --check
      - name: Render the habitat motion frames
        run: cargo run --locked --example habitat -- --frames target/habitat-frames
      - name: Habitat animation matches the actual buffers
        run: python3 tools/check-animation.py target/habitat-frames assets/readme/habitat-motion.gif
      - name: Motion demonstration tests
        run: cargo test --locked --example motion
      - name: Optional animation builder parses
        run: node --check tools/render-animation.cjs
      - name: Render the working and verification animation frames
        run: |
          cargo run --locked --example motion -- --frames target/motion-frames
          cargo run --locked --example motion -- --frames target/motion-light-frames --profile light-truecolor
      - name: Motion animations match the actual buffers
        run: |
          python3 tools/check-animation.py target/motion-frames assets/readme/motion-demo.gif
          python3 tools/check-animation.py target/motion-light-frames assets/readme/motion-demo-light.gif
